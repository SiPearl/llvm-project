include:
  - local: '.ci/sipearl-ci-templates.yml'

# Reuseable rules for branch-specific pipelines:

# -----[ Jobs ]----- #

check-formating:
  extends: ['.check-formating']
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^aci\/.*$/ || $CI_COMMIT_BRANCH =~ /^wip\/.*$/)
      when: never
    - when: always

build-x86_64-llvm-aarch64:
  extends: ['.build-llvm', '.common-x86_64']
  variables:
    LIT_TEST_DIRS: "test test/Unit"
    TARGET: aarch64
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^aci\/.*$/ || $CI_COMMIT_BRANCH =~ /^wip\/.*$/)
      when: never
    - when: always

build-x86_64-llvm-x86_64:
  extends: ['.build-llvm', '.common-x86_64']
  variables:
    LIT_TEST_DIRS: "test test/Unit"
    TARGET: x86_64
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^aci\/.*$/ || $CI_COMMIT_BRANCH =~ /^wip\/.*$/)
      when: never
    - when: always

llvm-x86_64-test-suite-x86_64:
  extends: ['.llvm-test-suite', '.common-x86_64']
  needs: ['build-x86_64-llvm-x86_64']
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^aci\/.*$/ || $CI_COMMIT_BRANCH =~ /^wip\/.*$/)
      when: never
    - when: always

  variables:
    SLURM_DEPENDENCIES_JOB: 'build-x86_64-llvm-x86_64'
    TARGET: x86_64

deploy-llvm:
  extends:     ['.deploy-llvm', '.common-x86_64']
  needs:       ['llvm-x86_64-test-suite-x86_64', 'build-x86_64-llvm-aarch64']
  variables:
      SLURM_DEPENDENCIES_JOB: 'build-x86_64-llvm-x86_64, build-x86_64-llvm-aarch64'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^aci\/.*$/ || $CI_COMMIT_BRANCH =~ /^wip\/.*$/)
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "sipearl" || $CI_COMMIT_BRANCH =~ /^release.*$/)
      when: always
    - allow_failure: true
      when: manual

build-aarch64-llvm-aarch64:
  extends: ['.build-llvm', '.common-aarch64']
  variables:
    TARGET: aarch64
    LIT_TEST_DIRS: "test test/Unit"
  rules:
  # Remove this when ampere come back to life
    - when: never
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^aci\/.*$/ || $CI_COMMIT_BRANCH =~ /^wip\/.*$/)
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: ($SIPEARL_TEST_TARGET == null || $SIPEARL_TEST_TARGET == "aarch64")

llvm-aarch64-test-suite-aarch64:
  extends: ['.llvm-test-suite', '.common-aarch64']
  needs: ['build-aarch64-llvm-aarch64']
  rules:
  # Remove this when ampere come back to life
    - when: never
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^aci\/.*$/ || $CI_COMMIT_BRANCH =~ /^wip\/.*$/)
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: ($SIPEARL_TEST_TARGET == null || $SIPEARL_TEST_TARGET == "aarch64")

  variables:
    SLURM_DEPENDENCIES_JOB: 'build-aarch64-llvm-aarch64'
    TARGET: aarch64

