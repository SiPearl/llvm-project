# -----[ Global Config ]----- #
include:
  - project: 'rhea/tools/gitlab_pipelines_templates'
    ref:     master
    file:    ['slurm-ci.yml']
stages: ['build', 'test', 'e2e-test']
default:
  tags: ['oracle8']
variables:
  SLURM_CHDIR_ROOT:   /scratch/sipearl
  SLURM_CPU:          16
  SLURM_MEMORY:       50000 # MB
  SLURM_DURATION:     0-2:00:00
  SLURM_ARTIFACT_DIR: ./artifacts
  SLURM_INLOCAL:      "true"

# -----[ Rules ]----- #

.no-fortran:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^jgi-.*$/  || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^jgi-.*$/ ||
          $CI_COMMIT_BRANCH =~ /^flang.*$/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^flang.*$/
      when: never
.only-fortran:
  rules:
    - if: $CI_COMMIT_BRANCH !~ /^jgi-.*$/  && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^jgi-.*$/ &&
          $CI_COMMIT_BRANCH !~ /^flang.*$/ && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^flang.*$/
      when: never
.no-wip:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^.*-wip$/
      when: never
.only-wip:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^.*-wip$/
      when: never

# -----[ Templates ]----- #

# A job that runs clang-format. This is not perfect because
# its hard to know what to use as base-commit for the diff
# that is checked. For merge-requests, the merged-to branch
# is used as base, and the last commit otherwise.
.check-formating:
  stage: build
  extends: ['.common-x86_64']
  tags: ['oracle8', 'local']
  script:
    - export NEW_COMMIT="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$(git rev-parse HEAD)}"
    - export BASE_COMMIT="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_COMMIT_BEFORE_SHA:-$(git rev-parse HEAD~1)}}"
    - '[ -n "${NEW_COMMIT}" ] && [ -n "${BASE_COMMIT}" ] && ${LLVM_TOOLS}/git-clang-format --diff ${BASE_COMMIT} ${NEW_COMMIT} > ./clang-format.diff'
  artifacts:
    paths: ['./clang-format.diff']
    expire_in: 2 days
    when: on_failure

# A set of tools suited for x86 hosts in the DZ, like be2-01 or so.
.common-x86_64:
  variables:
    CMAKE:         /toolsroot/lnx/cad/cmake-3.21.4-linux-x86_64/bin/cmake
    CCACHE:        /home_spl/etienne.renault/shared/opt/x86/ccache-4.8.2-install/bin/ccache
    CC:            /toolsroot/lnx/hpc/gcc-12.1.0-full+isl+binutils/bin/gcc
    CXX:           /toolsroot/lnx/hpc/gcc-12.1.0-full+isl+binutils/bin/g++
    LLVM_TOOLS:    /workspace02/sipearl/tools/x86/be2-01/internal/llvm/bin
    TARGET_TRIPLE: x86_64-pc-linux-gnu

# A set of tools suited for ampere04 (Note that ampere03 and ampere04 run different OSes).
.common-aarch64:
  variables:
    CMAKE:           /workspace02/sipearl/tools/aarch64/ampere04/usr/local/bin/cmake
    CCACHE:          /workspace02/sipearl/tools/aarch64/ampere04/usr/local/bin/ccache
    CC:              gcc
    CXX:             g++
    LLVM_TOOLS:      '' # Optional anyways, not needed.
    TARGET_TRIPLE:   aarch64-linux-gnu
    SLURM_PARTITION: sw1queue_aarch64_DC1
    SLURM_NODELIST:  ampere04
    PATH:            /usr/bin:$PATH

# A template for building LLVM and running the LLVM lit tests. This is currently a single
# stage because of missing tokens/permissions for the SLURM CI to be able to download
# artifacts. TODO: Test use of JOB_CI_TOKEN here? I would even recommend keeping this as
# a single job long-term because it causes less overhead.
.build-llvm:
  stage: build
  variables:
    GIT_STRATEGY:  none
    CFLAGS:        '-Os -pipe'
    CXXFLAGS:      '-Os -pipe'
    LLVM_PROJECTS: "clang" # NOTE: Middleend-/Backend-only branches do not even need clang, but the E2E tests do.
    LLVM_TARGETS:  all
    TARGET_TRIPLE: ''
    LIT_TEST_DIRS: "test/" # A whitespace-seperated list of subdirectories to run LIT tests from.
    CMAKE:         /bin/false # Has to be overwritten...
    CCACHE:        /bin/false
    CC:            /bin/false
    CXX:           /bin/false
  extends: ['.slurm-ci']
  script:
    - echo "---- BUILD LLVM ----"
    - ${SLURM_SCRIPT_CMD} ${CMAKE} -S ./llvm -B ./build -G "Unix Makefiles"
        -DCMAKE_BUILD_TYPE=MinSizeRel
        -DCMAKE_INSTALL_PREFIX=/ -DLLVM_INSTALL_UTILS=On -DCMAKE_CXX_STANDARD=17
        -DLLVM_ENABLE_ASSERTIONS=On -DLLVM_ENABLE_DUMP=On -DLLVM_BUILD_TESTS=On
        -DCMAKE_C_COMPILER="${CC}" -DCMAKE_C_FLAGS="${CFLAGS}" -DCMAKE_C_COMPILER_LAUNCHER="${CCACHE}" 
        -DCMAKE_CXX_COMPILER="${CXX}" -DCMAKE_CXX_FLAGS="${CXXFLAGS}" -DCMAKE_CXX_COMPILER_LAUNCHER="${CCACHE}"
        -DLLVM_ENABLE_PROJECTS="${LLVM_PROJECTS}"
        -DLLVM_TARGETS_TO_BUILD="${LLVM_TARGETS}"
        -DLLVM_DEFAULT_TARGET_TRIPLE="${TARGET_TRIPLE}"
    - ${SLURM_SCRIPT_CMD} mkdir -p ./artifacts
    - ${SLURM_SCRIPT_CMD} cp ./build/CMakeCache.txt ./artifacts/llvm-CMakeCache.txt
    - ${SLURM_SCRIPT_CMD} make -C ./build -j ${SLURM_CPU}
    - ${SLURM_SCRIPT_CMD} sh -c 'make -C ./build -j ${SLURM_CPU} DESTDIR=$(realpath ./artifacts/install) install install-clang'
    - ${SLURM_SCRIPT_CMD} sh -c 'python3 -m pip install --user ./llvm/utils/lit || true'
    - echo "---- TEST LLVM ----"
    - |
      for test_dir in ${LIT_TEST_DIRS} ; do
        report_name="lit-report.${test_dir//\//_}.xml"
        ${SLURM_SCRIPT_CMD} ./build/bin/llvm-lit -j ${SLURM_CPU} -s --xunit-xml-output ./artifacts/${report_name} ./build/${test_dir}
      done
  after_script:
    - !reference [.slurm-ci-artifacts, after_script]
    - !reference [.slurm-ci, after_script]
  artifacts:
    expire_in: 3 days
    when: always
    paths:
      - ./artifacts/
    reports:
      junit: ./artifacts/lit-report.*.xml

.llvm-test-suite:
  stage: test
  variables:
    GIT_STRATEGY:  none
  extends: ['.slurm-ci']
  allow_failure: true
  script:
    - !reference [.slurm-ci-needs, script]
      # The sipearl-ci branch is needed here because of the SiPearl-CI.cmake file not available on the default branch.
    - |
      ${SLURM_SCRIPT_CMD} sh -c "if [ $(uname -p) == 'x86_64' ]; then source /toolsroot/lnx/scripts/SPLmanagetools.sh -set 'hpc_gcc-12.1.0-full+isl+binutils' ; fi ;
                                 ${CMAKE} -S ./llvm-test-suite -B ./llvm-test-suite-build -G 'Unix Makefiles' -C ./llvm-test-suite/cmake/caches/SiPearl-CI.cmake &&
                                 make -C ./llvm-test-suite-build/ -j ${SLURM_CPU} &&
                                 lit -j ${SLURM_CPU} -s --xunit-xml-output ./artifacts/test-suite-report.xml ./llvm-test-suite-build"
  after_script:
    - !reference [.slurm-ci-artifacts, after_script]
    - !reference [.slurm-ci, after_script]
  artifacts:
    when: always
    reports:
      junit: ['./artifacts/test-suite-report.xml']

