# -----[ Global Config ]----- #
include:
  - project: 'rhea/tools/gitlab_pipelines_templates'
    ref:     master
    file:    ['slurm-ci.yml']
stages: ['build', 'test', 'deploy', 'update', 'e2e-test']
default:
  tags: ['sw']
variables:
  SLURM_CPU:          16
  SLURM_MEMORY:       50000 # MB
  SLURM_DURATION:     0-2:00:00
  SLURM_ARTIFACT_DIR: ./artifacts
  SLURM_INLOCAL:      "true"
  DEFAULT_SLURM_ALLOC_TIMEOUT: ""
  GIT_DEPTH:          30000

# -----[ Templates ]----- #

# A job that runs clang-format. This is not perfect because
# its hard to know what to use as base-commit for the diff
# that is checked. For merge-requests, the merged-to branch
# is used as base, and the last commit otherwise.
.check-formating:
  stage: build
  extends: ['.common-x86_64']
  tags: ['sw']
  script:
    - export
    - |
      set -eux
      if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-""}" ]; then
         export NEW_COMMIT=${CI_COMMIT_SHA}
      else
         export NEW_COMMIT="$(git rev-parse HEAD)"
      fi
    - |
      set -eux
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-""}" ]; then
         export BASE_COMMIT=${CI_MERGE_REQUEST_DIFF_BASE_SHA}
      else
         export BASE_COMMIT="${CI_COMMIT_BEFORE_SHA:-$(git rev-parse HEAD~1)}"
      fi
    - .ci/check_formating.sh "${BASE_COMMIT}" "${NEW_COMMIT}"  "${LLVM_TOOLS}/git-clang-format"
  artifacts:
    paths: ['./clang-format.diff']
    expire_in: 2 days
    when: on_failure

# A set of tools suited for x86 hosts in the DZ, like be2-01 or so.
.common-x86_64:
  variables:
    LLVM_TOOLS:    /workspace/sipearl/tools/x86_64/centos7.9-64/internal/opt/sipearl/clang/18.0.0/bin

# A set of tools suited for ampere04 (Note that ampere03 and ampere04 run different OSes).
.common-aarch64:
  variables:
    CMAKE:           /workspace02/sipearl/tools/aarch64/ampere04/usr/local/bin/cmake
    CCACHE:          /workspace02/sipearl/tools/aarch64/ampere04/usr/local/bin/ccache
    LLVM_TOOLS:      '' # Optional anyways, not needed.
    SLURM_CHDIR_ROOT:   /scratch/sipearl
    SLURM_PARTITION: sw1queue_aarch64_DC1
    SLURM_NODELIST:  ampere04
    PATH:            /usr/bin:$PATH

.build-llvm:
  stage: build
  variables:
    GIT_STRATEGY:  none
    CMAKE:         /bin/false # Has to be overwritten...
    CCACHE:        /bin/false
  extends: ['.slurm-ci']
  script:
    - echo "---- BUILD LLVM ----"
    - ${SLURM_SCRIPT_CMD}  JOBS=${SLURM_CPU} .ci/build-clang.sh ${TARGET}
  after_script:
    - !reference [.slurm-ci-artifacts, after_script]
    - !reference [.slurm-ci, after_script]
  artifacts:
    expire_in: 3 days
    when: always
    paths:
      - ./artifacts/
    reports:
      junit: ./artifacts/lit-report.*.xml

.llvm-test-suite:
  stage: test
  variables:
    GIT_STRATEGY:  none
  extends: ['.slurm-ci']
  script:
    - !reference [.slurm-ci-needs, script]
    - echo "---- TEST LLVM ----"
    - ${SLURM_SCRIPT_CMD}  JOBS=${SLURM_CPU} .ci/test-clang.sh ${TARGET}
  after_script:
    - !reference [.slurm-ci-artifacts, after_script]
    - !reference [.slurm-ci, after_script]
  artifacts:
    when: always
    reports:
      junit: ['./artifacts/test-suite-report.xml']

# A template to deploy LLVM
.deploy-llvm:
  stage: deploy
  variables:
    GIT_STRATEGY:  none
    ARTIFACTS:	   "./artifacts"
  extends: ['.slurm-ci']
  script:
    - !reference [.slurm-ci-needs, script]
    - echo "---- Deploying LLVM ----"
    - ${SLURM_SCRIPT_CMD}  .ci/deploy-clang.sh ${TARGET}
  after_script:
    - !reference [.slurm-ci-artifacts, after_script]
    - !reference [.slurm-ci, after_script]

# A template to update LLVM
.update-llvm:
  stage: update
  variables:
    GIT_STRATEGY:  none
    ARTIFACTS:	   "./artifacts"
  extends: ['.slurm-ci']
  script:
    - !reference [.slurm-ci-needs, script]
    - echo "---- Deploying LLVM ----"
    - ${SLURM_SCRIPT_CMD}  .ci/update-clang.sh ${TARGET}
  after_script:
    - !reference [.slurm-ci-artifacts, after_script]
    - !reference [.slurm-ci, after_script]
